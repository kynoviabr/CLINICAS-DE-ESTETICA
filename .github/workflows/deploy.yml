name: Publicar banco e funções

# Homologação: a cada merge na homolog, aplica as migrations e publica as funções do Supabase de homologação.
# Produção: a cada merge na main, faz o mesmo no Supabase de produção, depois da aprovação no ambiente "production"
#           (GitHub > Settings > Environments > production > Required reviewers).
#
# Segredos (GitHub > Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN          token pessoal do Supabase (Account > Access Tokens)
#   SUPABASE_DB_PASSWORD_HOMOLOG   senha do banco de homologação
#   SUPABASE_DB_PASSWORD_PROD      senha do banco de produção
# Variáveis (mesma tela, aba Variables):
#   SUPABASE_PROJECT_HOMOLOG       id do projeto de homologação
#   SUPABASE_PROJECT_PROD          id do projeto de produção

on:
  push:
    branches: [homolog, main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.ref_name == 'main' && vars.SUPABASE_PROJECT_PROD || vars.SUPABASE_PROJECT_HOMOLOG }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_HOMOLOG }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Confere a configuração
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam segredos/variáveis do Supabase para ${{ github.ref_name }}. Veja o topo deste arquivo."
            exit 1
          fi

      - name: Liga ao projeto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Para se o banco tiver migration que não existe no repositório (aplicada à mão fora do fluxo).
      - name: Confere migrations aplicadas fora do repositório
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee migrations.txt
          if awk -F'|' 'NR>2 && $1 ~ /^[[:space:]]*$/ && $2 ~ /[0-9]/ {found=1} END {exit !found}' migrations.txt; then
            echo "::error::O banco tem migration que não está no repositório. Versione-a antes de publicar."
            exit 1
          fi

      - name: Mostra o que vai ser aplicado
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Aplica as migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Publica as funções
        run: supabase functions deploy --project-ref "$PROJECT_REF"
